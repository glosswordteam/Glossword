services:
  php:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.glossword.rule=Host(`glossword.local`)"
      - "traefik.http.routers.glossword.entrypoints=web"
      - "traefik.http.services.glossword.loadbalancer.server.port=80"

  cloudbeaver:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.cloudbeaver.rule=Host(`db.glossword.local`)"
      - "traefik.http.routers.cloudbeaver.entrypoints=web"
      - "traefik.http.services.cloudbeaver.loadbalancer.server.port=8978"
