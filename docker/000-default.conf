ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/

    <Directory /var/www/html/>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    LogFormat "%h \"%m %U%q %H\" %>s" minimal

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 minimal
</VirtualHost>
