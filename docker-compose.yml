services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glossword-php
    ports:
      - "8082:80"
    volumes:
      - ./1.8:/var/www/html
      - ./docker/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - web

  mysql:
    image: mysql:5.7
    container_name: glossword-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: glossword18
      MYSQL_USER: glossword
      MYSQL_PASSWORD: glossword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      interval: 10s
      retries: 5
    ports:
      - "3306:3306"
    networks:
      - default

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: glossword-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_USER: glossword
      PMA_PASSWORD: glossword
    depends_on:
      - mysql
    ports:
      - "8182:80"
    networks:
      - default
      - web

networks:
  web:
    external: true
    name: web

volumes:
  mysql_data:
    name: glossword_mysql_data